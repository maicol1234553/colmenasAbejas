spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/gestion_colmenas
    username: postgres
    password: 123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

server:
  port: 8080

app:
  jwt:
    secreto: MiSuperClaveSecretaJWTParaAbejas2024!@#$%^&*()_+ABCDEFGHIJKLMNOPQRSTUVWXYZ
    expiracion-ms: 86400000
    inicio-header: Authorization
    prefijo: "Bearer "
